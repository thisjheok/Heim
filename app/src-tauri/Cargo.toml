[package]
name = "heim"
version = "0.1.0"
description = "A shared workspace for AI-driven development"
authors = ["Heim"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "heim_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.3", features = [] }
tauri-plugin-log = "2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rfd = "0.17.2"
tokio = { version = "1.53.3", features = ["process", "io-util", "sync", "rt", "time", "macros"] }
walkdir = "2.5.0"
sha2 = "0.11.1"
